name: Solvyn CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check solvyn/
      - name: MyPy type check
        # pyproject's [tool.mypy] already sets strict mode; --follow-imports=skip
        # made pydantic resolve as Any and produced phantom untyped-decorator
        # errors. Keep the gate honest — the codebase passes strict mypy.
        run: mypy solvyn/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: solvyn
          POSTGRES_PASSWORD: solvyn
          POSTGRES_DB: solvyn
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Initialize test database
        run: |
          PGPASSWORD=solvyn psql -h localhost -U solvyn -d solvyn -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE solvyn_migrator LOGIN PASSWORD 'solvyn_migrator' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE solvyn_runtime LOGIN PASSWORD 'solvyn_runtime' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE solvyn OWNER TO solvyn_migrator;
          ALTER SCHEMA public OWNER TO solvyn_migrator;
          GRANT CONNECT ON DATABASE solvyn TO solvyn_runtime;
          GRANT USAGE ON SCHEMA public TO solvyn_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE solvyn_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO solvyn_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE solvyn_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO solvyn_runtime;
          SQL
          alembic upgrade head
          python tests/seed_ci_tenant.py
        env:
          DATABASE_URL: postgresql+asyncpg://solvyn_runtime:solvyn_runtime@localhost:5432/solvyn
          MIGRATION_DATABASE_URL: postgresql+asyncpg://solvyn_migrator:solvyn_migrator@localhost:5432/solvyn
          REDIS_URL: redis://localhost:6379/0
          API_KEY_SECRET: test-secret-key-for-ci-only
      - name: Run tests
        run: pytest tests/ -v --cov=solvyn
        env:
          DATABASE_URL: postgresql+asyncpg://solvyn_runtime:solvyn_runtime@localhost:5432/solvyn
          REDIS_URL: redis://localhost:6379/0
          API_KEY_SECRET: test-secret-key-for-ci-only
      - name: Smoke test database backup and restore
        run: bash scripts/backup-restore-smoke.sh
      - name: Check for dependency vulnerabilities
        run: pip install pip-audit && pip-audit

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        id: image-name
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:latest,${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }}
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}-frontend:latest,${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}-frontend:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Run database migrations
        run: |
          kubectl delete job solvyn-migrate -n solvyn --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/solvyn-migrate -n solvyn --timeout=120s
      - name: Deploy to staging
        run: |
          kubectl set image deployment/solvyn-api api=${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:${{ github.sha }} -n solvyn
          kubectl set image deployment/solvyn-frontend frontend=${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}-frontend:${{ github.sha }} -n solvyn
          kubectl rollout status deployment/solvyn-api -n solvyn --timeout=5m
          kubectl rollout status deployment/solvyn-frontend -n solvyn --timeout=5m

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Manual approval gate
        run: echo "Deploying to production..."
      - name: Run database migrations
        run: |
          kubectl delete job solvyn-migrate -n solvyn-prod --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml -n solvyn-prod
          kubectl wait --for=condition=complete job/solvyn-migrate -n solvyn-prod --timeout=120s
      - name: Deploy to production
        run: |
          kubectl set image deployment/solvyn-api api=${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:${{ github.sha }} -n solvyn-prod
          kubectl set image deployment/solvyn-frontend frontend=${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}-frontend:${{ github.sha }} -n solvyn-prod
          kubectl rollout status deployment/solvyn-api -n solvyn-prod --timeout=5m
          kubectl rollout status deployment/solvyn-frontend -n solvyn-prod --timeout=5m
