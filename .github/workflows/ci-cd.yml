name: Solvyn CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the validated commit to production after staging succeeds
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check solvyn/
      - name: MyPy type check
        # pyproject's [tool.mypy] already sets strict mode; --follow-imports=skip
        # made pydantic resolve as Any and produced phantom untyped-decorator
        # errors. Keep the gate honest — the codebase passes strict mypy.
        run: mypy solvyn/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: solvyn
          POSTGRES_PASSWORD: solvyn
          POSTGRES_DB: solvyn
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Initialize test database
        run: |
          PGPASSWORD=solvyn psql -h localhost -U solvyn -d solvyn -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE solvyn_migrator LOGIN PASSWORD 'solvyn_migrator' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE solvyn_runtime LOGIN PASSWORD 'solvyn_runtime' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE solvyn OWNER TO solvyn_migrator;
          ALTER SCHEMA public OWNER TO solvyn_migrator;
          GRANT CONNECT ON DATABASE solvyn TO solvyn_runtime;
          GRANT USAGE ON SCHEMA public TO solvyn_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE solvyn_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO solvyn_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE solvyn_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO solvyn_runtime;
          SQL
          alembic upgrade head
          python tests/seed_ci_tenant.py
        env:
          DATABASE_URL: postgresql+asyncpg://solvyn_runtime:solvyn_runtime@localhost:5432/solvyn
          MIGRATION_DATABASE_URL: postgresql+asyncpg://solvyn_migrator:solvyn_migrator@localhost:5432/solvyn
          REDIS_URL: redis://localhost:6379/0
          API_KEY_SECRET: test-secret-key-for-ci-only
      - name: Run tests
        run: pytest tests/ -v --cov=solvyn
        env:
          DATABASE_URL: postgresql+asyncpg://solvyn_runtime:solvyn_runtime@localhost:5432/solvyn
          REDIS_URL: redis://localhost:6379/0
          API_KEY_SECRET: test-secret-key-for-ci-only
      - name: Smoke test database backup and restore
        run: bash scripts/backup-restore-smoke.sh
      - name: Check for dependency vulnerabilities
        run: pip install pip-audit && pip-audit

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Normalize image name
        id: image-name
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:latest,${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }}
      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}-frontend:latest,${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}-frontend:${{ github.sha }}

  publish:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Normalize image name
        id: image-name
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:latest,${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }}
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}-frontend:latest,${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}-frontend:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "${KUBE_CONFIG:-}" ]]; then
            echo "KUBE_CONFIG is missing from the staging GitHub Environment. Store the base64-encoded kubeconfig as the staging environment secret named KUBE_CONFIG." >&2
            exit 1
          fi
          config_path="$RUNNER_TEMP/kubeconfig"
          if ! printf '%s' "$KUBE_CONFIG" | base64 --decode > "$config_path"; then
            echo "KUBE_CONFIG is not valid base64." >&2
            exit 1
          fi
          if [[ ! -s "$config_path" ]]; then
            echo "KUBE_CONFIG decoded to an empty file." >&2
            exit 1
          fi
          chmod 600 "$config_path"
          echo "KUBECONFIG=$config_path" >> "$GITHUB_ENV"
          KUBECONFIG="$config_path" kubectl auth can-i --quiet create jobs -n solvyn
          KUBECONFIG="$config_path" kubectl auth can-i --quiet delete jobs -n solvyn
          KUBECONFIG="$config_path" kubectl auth can-i --quiet get jobs -n solvyn
          KUBECONFIG="$config_path" kubectl auth can-i --quiet watch jobs -n solvyn
          KUBECONFIG="$config_path" kubectl auth can-i --quiet patch deployments -n solvyn
          KUBECONFIG="$config_path" kubectl auth can-i --quiet get deployments -n solvyn
          KUBECONFIG="$config_path" kubectl auth can-i --quiet watch deployments -n solvyn
      - name: Run database migrations
        run: |
          kubectl delete job solvyn-migrate -n solvyn --ignore-not-found
          sed "s|image: solvyn/api:latest|image: ${{ env.REGISTRY }}/${{ needs.publish.outputs.image_name }}:${{ github.sha }}|" k8s/migration-job.yaml \
            | kubectl apply -f - -n solvyn
          kubectl wait --for=condition=complete job/solvyn-migrate -n solvyn --timeout=120s
      - name: Deploy to staging
        run: |
          kubectl set image deployment/solvyn-api api=${{ env.REGISTRY }}/${{ needs.publish.outputs.image_name }}:${{ github.sha }} -n solvyn
          kubectl set image deployment/solvyn-frontend frontend=${{ env.REGISTRY }}/${{ needs.publish.outputs.image_name }}-frontend:${{ github.sha }} -n solvyn
          kubectl rollout status deployment/solvyn-api -n solvyn --timeout=5m
          kubectl rollout status deployment/solvyn-frontend -n solvyn --timeout=5m

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [publish, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "${KUBE_CONFIG:-}" ]]; then
            echo "KUBE_CONFIG is missing from the production GitHub Environment. Store the base64-encoded kubeconfig as the production environment secret named KUBE_CONFIG." >&2
            exit 1
          fi
          config_path="$RUNNER_TEMP/kubeconfig"
          if ! printf '%s' "$KUBE_CONFIG" | base64 --decode > "$config_path"; then
            echo "KUBE_CONFIG is not valid base64." >&2
            exit 1
          fi
          if [[ ! -s "$config_path" ]]; then
            echo "KUBE_CONFIG decoded to an empty file." >&2
            exit 1
          fi
          chmod 600 "$config_path"
          echo "KUBECONFIG=$config_path" >> "$GITHUB_ENV"
          KUBECONFIG="$config_path" kubectl auth can-i --quiet create jobs -n solvyn-prod
          KUBECONFIG="$config_path" kubectl auth can-i --quiet delete jobs -n solvyn-prod
          KUBECONFIG="$config_path" kubectl auth can-i --quiet get jobs -n solvyn-prod
          KUBECONFIG="$config_path" kubectl auth can-i --quiet watch jobs -n solvyn-prod
          KUBECONFIG="$config_path" kubectl auth can-i --quiet patch deployments -n solvyn-prod
          KUBECONFIG="$config_path" kubectl auth can-i --quiet get deployments -n solvyn-prod
          KUBECONFIG="$config_path" kubectl auth can-i --quiet watch deployments -n solvyn-prod
      - name: Run database migrations
        run: |
          kubectl delete job solvyn-migrate -n solvyn-prod --ignore-not-found
          sed -e "s|image: solvyn/api:latest|image: ${{ env.REGISTRY }}/${{ needs.publish.outputs.image_name }}:${{ github.sha }}|" \
              -e 's|namespace: solvyn|namespace: solvyn-prod|' k8s/migration-job.yaml \
            | kubectl apply -f - -n solvyn-prod
          kubectl wait --for=condition=complete job/solvyn-migrate -n solvyn-prod --timeout=120s
      - name: Deploy to production
        run: |
          kubectl set image deployment/solvyn-api api=${{ env.REGISTRY }}/${{ needs.publish.outputs.image_name }}:${{ github.sha }} -n solvyn-prod
          kubectl set image deployment/solvyn-frontend frontend=${{ env.REGISTRY }}/${{ needs.publish.outputs.image_name }}-frontend:${{ github.sha }} -n solvyn-prod
          kubectl rollout status deployment/solvyn-api -n solvyn-prod --timeout=5m
          kubectl rollout status deployment/solvyn-frontend -n solvyn-prod --timeout=5m
