apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solvyn-api-network-policy
  namespace: solvyn
spec:
  podSelector:
    matchLabels:
      app: solvyn-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: solvyn-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: solvyn-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solvyn-db-network-policy
  namespace: solvyn
spec:
  podSelector:
    matchLabels:
      app: solvyn-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: solvyn-api
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solvyn-redis-network-policy
  namespace: solvyn
spec:
  podSelector:
    matchLabels:
      app: solvyn-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: solvyn-api
      ports:
        - protocol: TCP
          port: 6379
  egress: []
