apiVersion: v1
kind: Secret
metadata:
  name: solvyn-secrets
  namespace: solvyn
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  POSTGRES_APP_PASSWORD: "use-a-different-long-random-password"
  POSTGRES_MIGRATION_PASSWORD: "use-another-different-long-random-password"
  DATABASE_URL: "postgresql+asyncpg://solvyn_runtime:URL_ENCODED_RUNTIME_PASSWORD@solvyn-db:5432/solvyn"
  MIGRATION_DATABASE_URL: "postgresql+asyncpg://solvyn_migrator:URL_ENCODED_MIGRATION_PASSWORD@solvyn-db:5432/solvyn"
  OPENROUTER_API_KEY: "sk-or-v1-..."
  GROQ_API_KEY: "gsk_..."
  DEEPSEEK_API_KEY: "sk-..."
  API_KEY_SECRET: "change-me-to-a-random-secret"
