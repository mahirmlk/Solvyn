apiVersion: batch/v1
kind: Job
metadata:
  name: solvyn-migrate
  namespace: solvyn
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: migrate
          image: solvyn/api:latest
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: solvyn-secrets
                  key: DATABASE_URL
                  optional: true
      restartPolicy: OnFailure
