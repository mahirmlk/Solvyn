apiVersion: v1
kind: Service
metadata:
  name: solvyn-api
  namespace: solvyn
spec:
  selector:
    app: solvyn-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: solvyn-db
  namespace: solvyn
spec:
  selector:
    app: solvyn-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: solvyn-redis
  namespace: solvyn
spec:
  selector:
    app: solvyn-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
