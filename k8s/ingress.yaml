apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solvyn-ingress
  namespace: solvyn
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - solvyn.example.com
      secretName: solvyn-tls
  rules:
    - host: solvyn.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: solvyn-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solvyn-frontend
                port:
                  number: 3000
