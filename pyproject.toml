[project]
name = "solvyn"
version = "0.1.0"
description = "Your self-hosted AI engineering team"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.21.0",
    "jinja2>=3.1.0",
    "pgvector>=0.3.0",
    "langfuse>=2.0.0",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.8.0",
]

[project.scripts]
solvyn = "solvyn.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
include = ["solvyn", "solvyn.*"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that exercise the full HTTP/middleware/agent stack",
    "unit: fast, hermetic unit tests for individual components",
]
