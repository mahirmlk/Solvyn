http_port 3128
visible_hostname solvyn-dependency-proxy
cache deny all
cache_store_log none
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Proxy-Authorization deny all

acl CONNECT method CONNECT
acl TLS_port port 443
acl allowed_registry dstdomain pypi.org files.pythonhosted.org

http_access deny !allowed_registry
http_access deny CONNECT !TLS_port
http_access allow allowed_registry
http_access deny all
