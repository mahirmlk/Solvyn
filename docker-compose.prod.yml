name: solvyn

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?Set POSTGRES_MIGRATION_USER in .env.production}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD in .env.production}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env.production}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env.production}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:?Set POSTGRES_BACKUP_USER in .env.production}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?Set POSTGRES_BACKUP_PASSWORD in .env.production}
      POSTGRES_RESTORE_USER: ${POSTGRES_RESTORE_USER:?Set POSTGRES_RESTORE_USER in .env.production}
      POSTGRES_RESTORE_PASSWORD: ${POSTGRES_RESTORE_PASSWORD:?Set POSTGRES_RESTORE_PASSWORD in .env.production}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  migrate:
    build:
      context: .
    image: solvyn-api:local
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env.production}
      ENABLE_WORKFLOW_SCHEDULER: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    build:
      context: .
    image: solvyn-api:local
    restart: unless-stopped
    env_file: ${SOLVYN_APP_ENV_FILE:-.env.application}
    environment:
      ENABLE_WORKFLOW_SCHEDULER: "false"
      HOST: 0.0.0.0
      PORT: 8000
      SANDBOX_WORKSPACE_ROOT: /app/.solvyn/workspaces
      SANDBOX_RUNTIME_URL: http://sandbox:8001
      SANDBOX_RUNTIME_TOKEN: ${SANDBOX_RUNTIME_TOKEN:?Set SANDBOX_RUNTIME_TOKEN in .env.production}
    volumes:
      - sandbox_workspaces:/app/.solvyn/workspaces
    networks:
      - default
      - sandbox-control
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/deep', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  worker:
    build:
      context: .
    image: solvyn-api:local
    restart: unless-stopped
    env_file: ${SOLVYN_APP_ENV_FILE:-.env.application}
    environment:
      ENABLE_WORKFLOW_SCHEDULER: "true"
      SANDBOX_RUNTIME_TOKEN: ""
    command: ["python", "-m", "solvyn.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  sandbox-job-image:
    build:
      context: .
      dockerfile: sandbox.Dockerfile
    image: solvyn-sandbox:local
    restart: "no"
    command: ["true"]
    networks:
      - sandbox-control

  sandbox-workspace-init:
    image: solvyn-sandbox-supervisor:local
    restart: "no"
    user: "0:0"
    entrypoint: ["python", "-c"]
    command: ["from pathlib import Path; import os; p=Path('/workspaces'); p.mkdir(parents=True, exist_ok=True); os.chown(p, 10001, 10001); p.chmod(0o700)"]
    volumes:
      - sandbox_workspaces:/workspaces
    depends_on:
      sandbox-job-image:
        condition: service_completed_successfully
    networks:
      - sandbox-control

  sandbox:
    build:
      context: .
      dockerfile: sandbox-supervisor.Dockerfile
    image: solvyn-sandbox-supervisor:local
    restart: unless-stopped
    environment:
      SANDBOX_WORKSPACE_ROOT: /app/.solvyn/workspaces
      SANDBOX_RUNTIME_TOKEN: ${SANDBOX_RUNTIME_TOKEN:?Set SANDBOX_RUNTIME_TOKEN in .env.production}
    volumes:
      - sandbox_workspaces:/app/.solvyn/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox-control
    depends_on:
      sandbox-workspace-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./frontend
    image: solvyn-frontend:local
    restart: unless-stopped
    environment:
      SOLVYN_API_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  pgdata:
  redisdata:
  sandbox_workspaces:

networks:
  sandbox-control:
    internal: true
