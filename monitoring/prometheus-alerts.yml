groups:
  - name: solvyn-api
    rules:
      - alert: SolvynApiScrapeFailed
        expr: up{job="solvyn-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Solvyn API metrics endpoint is unavailable"
          description: "Prometheus has been unable to scrape the Solvyn API metrics endpoint for more than two minutes. Check the API container and the monitoring network."

      - alert: SolvynApiHigh5xxRate
        expr: |
          (
            sum(rate(solvyn_http_requests_total{job="solvyn-api", status=~"5.."}[5m]))
            /
            sum(rate(solvyn_http_requests_total{job="solvyn-api"}[5m]))
          ) > 0.05
          and
          sum(rate(solvyn_http_requests_total{job="solvyn-api", status=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Solvyn API server error rate is above 5%"
          description: "More than 5% of observed Solvyn API requests returned 5xx responses over the last five minutes. Investigate API logs and dependencies."
